<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
  </defs>
  <!-- Nền Squircle bo góc hiện đại theo phong cách ứng dụng cao cấp -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <!-- Viền sáng tinh tế bên trong -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
  
  <!-- Điểm sáng AI (Neural Pulse Spark) ở góc trên -->
  <circle cx="49" cy="15" r="7" fill="#38bdf8" opacity="0.35" />
  <circle cx="49" cy="15" r="3.5" fill="url(#glowDot)" />

  <!-- Monogram chữ lồng HA (Nguyễn Hoài An) đậm, rõ nét ở mọi kích thước tab -->
  <text x="30" y="44" font-family="'Be Vietnam Pro', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">HA</text>
</svg>
